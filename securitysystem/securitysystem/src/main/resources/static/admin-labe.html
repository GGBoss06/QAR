<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>L-ABE总览 - QAR安全系统</title>
    <link rel="stylesheet" href="/assets/app.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/assets/sidebar.js"></script>
    <script src="/assets/classie.js?v=2"></script>
    <script src="/assets/sidebarEffects.js?v=2"></script>
  </head>
  <body>
    <div id="st-container" class="st-container">
      <nav class="st-menu st-effect-12" id="menu-12">
        <h2>QAR安全系统</h2>
        <ul class="sidebar-menu">
          <li>
            <a href="/workbench">
              <i class="fa fa-dashboard"></i> 工作台
            </a>
          </li>
          <li>
            <a href="/feedback">
              <i class="fa fa-envelope"></i> 反馈与联系
            </a>
          </li>
          <li class="active">
            <a href="#">
              <i class="fa fa-cogs"></i> 管理后台
              <i class="fa fa-angle-down"></i>
            </a>
            <ul class="sub-menu">
              <li><a href="/admin"><i class="fa fa-home"></i> 管理首页</a></li>
              <li><a href="/admin-data.html"><i class="fa fa-database"></i> 数据管理</a></li>
              <li class="active"><a href="/admin-labe.html"><i class="fa fa-shield"></i> L-ABE总览</a></li>
              <li><a href="/admin-flight.html"><i class="fa fa-plane"></i> 飞行数据管理</a></li>
              <li><a href="/admin-qar.html"><i class="fa fa-table"></i> QAR表格管理</a></li>
            </ul>
          </li>
        </ul>
      </nav>
      <div class="st-pusher">
        <div class="st-content">
          <div class="nav">
            <div class="nav-inner">
              <button data-effect="st-effect-12" class="menu-trigger">☰</button>
              <div class="brand">QAR安全系统</div>
              <div class="spacer"></div>
              <div id="me-pill" class="pill"><span>加载中...</span></div>
              <button class="btn btn-logout" id="btn-logout" title="退出登录"><i class="fa fa-sign-out"></i></button>
            </div>
          </div>
          <div class="container">
            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:20px; margin-bottom:24px;">
              <div class="card stats-card"><div class="card-h"><div class="h2">总文件数</div></div><div class="card-b"><div class="stats-value" id="ov-total-files">0</div><div class="stats-desc">系统内全部文件</div></div></div>
              <div class="card stats-card"><div class="card-h"><div class="h2">受控文件</div></div><div class="card-b"><div class="stats-value" id="ov-lattice-files">0</div><div class="stats-desc">已启用访问控制</div></div></div>
              <div class="card stats-card"><div class="card-h"><div class="h2">属性权威</div></div><div class="card-b"><div class="stats-value" id="ov-authorities">0</div><div class="stats-desc">已加载权威数量</div></div></div>
              <div class="card stats-card"><div class="card-h"><div class="h2">已授权人员</div></div><div class="card-b"><div class="stats-value" id="ov-bundles">0</div><div class="stats-desc">已具备访问凭据</div></div></div>
            </div>

            <div class="grid" style="grid-template-columns:1fr;gap:24px">
              <div class="card">
                <div class="card-h">
                  <div class="h2">权威分工</div>
                  <div class="muted">展示属性策略与用户绑定格密钥封装原型中的权威域及负责范围</div>
                </div>
                <div class="card-b">
                  <table class="table" id="labe-authorities-table">
                    <thead>
                      <tr>
                        <th>权威</th>
                        <th>负责属性</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>

            <div class="card" style="margin-top:24px">
              <div class="card-h">
                <div class="h2">人员属性与发钥状态</div>
                <div class="muted">点击人员查看其访问属性和授权状态</div>
              </div>
              <div class="card-b">
                <div class="grid" style="grid-template-columns:1.2fr 1fr;gap:24px">
                  <div class="table-responsive">
                    <table class="table" id="labe-persons-table">
                      <thead>
                        <tr>
                          <th>工号</th>
                          <th>姓名</th>
                          <th>部门</th>
                          <th>人员分类</th>
                          <th>密级</th>
                          <th>账号</th>
                          <th>授权状态</th>
                        </tr>
                      </thead>
                      <tbody></tbody>
                    </table>
                  </div>
                  <div class="col">
                    <div class="info-panel" id="labe-person-summary">请选择左侧人员查看详情。</div>
                    <div>
                      <div class="label">属性集合</div>
                      <div class="chip-list" id="labe-person-attributes"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="toast" id="toast"><div class="t">提示</div><div class="m"></div></div>
    <script src="/assets/common.js?v=20260814-csrf"></script>
    <script src="/assets/admin-labe.js"></script>
  </body>
</html>
