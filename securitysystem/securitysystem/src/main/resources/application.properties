spring.application.name=securitysystem
server.port=8101

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Reverse-proxy deployments should set APP_FORWARD_HEADERS_STRATEGY=framework.
server.forward-headers-strategy=${APP_FORWARD_HEADERS_STRATEGY:none}

# 默认使用 MySQL。用户名、密码和连接地址均可通过环境变量覆盖。
spring.datasource.url=${APP_DB_URL:jdbc:mysql://127.0.0.1:3306/qar?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${APP_DB_USERNAME:root}
spring.datasource.password=${APP_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.CharSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

app.admin.username=${APP_ADMIN_USERNAME:admin}
# 新部署必须通过环境变量显式提供初始管理员密码；不得在仓库中保留默认口令。
app.admin.password=${APP_ADMIN_PASSWORD:}

app.security.cookieName=QAR_SESSION
# 本地使用 http://localhost 时必须为 false；HTTPS 部署时通过环境变量改为 true。
app.security.cookieSecure=${APP_COOKIE_SECURE:false}
app.security.cookieSameSite=Strict
app.security.sessionTtlMinutes=60
# Local HTTP development keeps this false. Production HTTPS deployments must set it to true.
app.security.requireHttps=${APP_REQUIRE_HTTPS:false}

app.person.seedEnabled=true
app.person.seedCsv=classpath:person_seed.csv

# Unified upload limits for multipart and JSON/Base64 upload paths.
app.file.max-bytes=${APP_FILE_MAX_BYTES:26214400}
spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:30MB}

# Attribute-bound post-quantum key material. Keep this directory outside public/static paths.
app.crypto.lattice-attribute-dir=${APP_LATTICE_ATTRIBUTE_DIR:data/crypto/lattice-attributes}
app.crypto.migrate-legacy-envelopes=${APP_MIGRATE_LEGACY_ENVELOPES:true}
